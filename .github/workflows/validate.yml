name: validate

# Run on every push to main and on every PR. Same gate that
# `claude plugin tag` enforces locally — manifests parse, validate,
# and the marketplace entry agrees with each plugin's plugin.json on
# version.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node (Claude Code CLI runtime)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace manifest
        run: claude plugin validate .

      - name: Validate every plugin manifest
        # Walks `plugins/*/` and validates each. Fails if any plugin's
        # plugin.json is missing or malformed. Adding a new plugin
        # auto-extends coverage — no workflow edit needed.
        run: |
          set -e
          for d in plugins/*/; do
            echo "── $d ──"
            claude plugin validate "$d"
          done

      - name: Cross-check marketplace ↔ plugin.json version agreement
        # For each plugins/<name>/, verify the marketplace entry's
        # `version` field matches the plugin's `plugin.json` version.
        # `jq` does the read; `diff` makes the mismatch loud.
        #
        # NOT using `claude plugin tag --dry-run` here: that command
        # fails when the tag for the current version already exists,
        # which is the *normal* state after a release ships — every
        # subsequent PR would then trip a "tag already exists" error
        # unrelated to whether manifests actually agree.
        run: |
          set -e
          for d in plugins/*/; do
            name=$(basename "$d")
            plugin_v=$(jq -r '.version' "$d/.claude-plugin/plugin.json")
            mkt_v=$(jq -r --arg n "$name" \
              '.plugins[] | select(.name == $n) | .version' \
              .claude-plugin/marketplace.json)
            echo "── $name: plugin.json=$plugin_v marketplace=$mkt_v ──"
            if [ "$plugin_v" != "$mkt_v" ]; then
              echo "❌ version mismatch for $name: plugin.json=$plugin_v vs marketplace.json=$mkt_v"
              exit 1
            fi
            if [ -z "$mkt_v" ] || [ "$mkt_v" = "null" ]; then
              echo "❌ plugin $name has no entry in .claude-plugin/marketplace.json"
              exit 1
            fi
          done

      - name: JSON syntax sanity (manifests + .lsp.json)
        # `claude plugin validate` already covers manifest semantics;
        # this is just a belt-and-suspenders parse check covering the
        # plugin-internal artifacts (.lsp.json, etc.) that the validator
        # treats as opaque.
        run: |
          set -e
          for f in $(find . -type f -name "*.json" -not -path "./node_modules/*"); do
            echo "parsing $f"
            python3 -c "import json,sys; json.load(open('$f'))"
          done
